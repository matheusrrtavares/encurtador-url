services:

  mongodb:
    image: mongo
    container_name: mongodb-encurtador
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: matheusrodrigues2007/encurtador-url-public-api:latest
    container_name: encurtador-api
    ports:
      - "8080:8080"
    environment:
        MONGO_USERNAME: ${MONGO_USERNAME}
        MONGO_PASSWORD: ${MONGO_PASSWORD}
        MONGO_HOST: mongodb
        MONGO_PORT: 27017
        MONGO_DATABASE: ${MONGO_DATABASE:-encurtadorurl}
    depends_on:
       mongodb:
         condition: service_healthy
    restart: unless-stopped

volumes:
    mongodb_data: